<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원 정보</title>
</head>
<body>
<h2>회원 정보</h2>

<div th:if="${user != null}">
  사용자 번호 : <span th:text="${user.no}"></span>
  <br>
  사용자 아이디 : <span th:text="${user.username}"></span>
  <br>
  사용자 주소 : <span th:text="${user.address}"></span>
</div>

<div th:if="${user == null}">
  회원 정보가 존재하지 않습니다.
</div>
</body>
</html>
