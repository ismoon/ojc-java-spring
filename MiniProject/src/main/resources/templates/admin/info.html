
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <!-- 제목 -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0">관리자 페이지</h2>
                <span class="badge bg-success">ADMIN</span>
            </div>

            <!-- 관리자 정보 -->
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 25%;">항목</th>
                        <th>내용</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 아이디 -->
                    <tr>
                        <th>아이디</th>
                        <!-- <td th:text="${#authentication.name}"></td> -->
                        <!-- <td sec:authentication="name"></td> -->
                        <td sec:authentication="principal.username"></td>
                    </tr>

                    <!-- 이름 -->
                    <tr>
                        <th>이름</th>
                        <td sec:authentication="principal.nickname"></td>
                    </tr>

                    <!-- 이메일 -->
                    <tr>
                        <th>이메일</th>
                        <td sec:authentication="principal.email"></td>
                    </tr>

                    <!-- 사용자의 권한 출력 -->
                    <tr>
                        <th>권한</th>
                        <td sec:authentication="authorities"></td>
                    </tr>

                    <!-- 인증 주체에 해당하는 객체 출력 -->
                    <tr>
                        <th>인증 주체 (Principal)</th>
                        <td class="text-break"
                            sec:authentication="principal"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
